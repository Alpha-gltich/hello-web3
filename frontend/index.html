<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HelloWeb3 — On-Chain Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg-glow: #10162a;
    --card: #10141f;
    --card-border: #262c42;
    --line: #1c2135;
    --dot: #2a3252;
    --text: #eef0f6;
    --muted: #8b93ab;
    --muted-2: #5c6382;
    --cyan: #22d3ee;
    --violet: #7c6cf6;
    --blue: #3b82f6;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse 900px 600px at 20% -10%, var(--bg-glow) 0%, var(--bg) 55%);
    font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    color: var(--text);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 20px;
    position: relative;
    overflow-x: hidden;
  }

  #network-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
  }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0) 40%), var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 36px 38px 30px;
    box-shadow:
      0 0 0 1px rgba(124, 108, 246, 0.06),
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 80px -30px rgba(124, 108, 246, 0.25);
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 30px;
  }
  .brand h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .brand h1 .web3 {
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .brand .sub {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 13.5px;
  }
  .brand .sub .rule {
    height: 2px;
    width: 34px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
  }

  .step {
    margin-bottom: 26px;
  }
  .step:last-of-type { margin-bottom: 0; }

  .step-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .badge {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12.5px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }
  .step-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
  }

  .btn-connect {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--line);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-connect:hover { background: #1a1f33; border-color: var(--muted-2); }
  .btn-connect:disabled { opacity: 0.5; cursor: not-allowed; }

  .wallet-chip {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    background: linear-gradient(90deg, #0d9488, var(--blue));
    display: none;
    align-items: center;
    justify-content: space-between;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    font-weight: 500;
    color: white;
  }
  .wallet-chip.visible { display: flex; }
  .wallet-chip .left {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .wallet-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px #4ade80;
    flex-shrink: 0;
  }
  .wallet-chip .copy-btn {
    background: rgba(255,255,255,0.15);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
  }
  .wallet-chip .copy-btn:hover { background: rgba(255,255,255,0.25); }

  .message-box {
    position: relative;
    background: var(--line);
    border-left: 3px solid var(--cyan);
    border-radius: 0 10px 10px 0;
    padding: 16px 18px;
    padding-right: 100px;
    min-height: 1.3em;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .refresh-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--card-border);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
  }
  .refresh-btn:hover { background: var(--muted-2); }
  .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cursor {
    display: inline-block;
    width: 6px;
    background: var(--cyan);
    animation: blink 0.9s steps(1) infinite;
    margin-left: 1px;
    height: 1em;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--line);
    border: 1px solid var(--card-border);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 12px;
  }
  input::placeholder { color: var(--muted-2); }
  input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .btn-send {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--cyan), var(--blue));
    color: #061019;
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: filter 0.15s ease;
  }
  .btn-send:hover { filter: brightness(1.08); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
  .btn-send svg { width: 15px; height: 15px; }

  .status-pill {
    margin-top: 16px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 15px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .status-pill.visible { display: flex; }
  .status-pill.ok {
    background: rgba(52, 211, 153, 0.1);
    border: 1px solid rgba(52, 211, 153, 0.25);
    color: #a7f3d4;
  }
  .status-pill.pending {
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.25);
    color: #fde3a7;
  }
  .status-pill.err {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    color: #fecaca;
  }
  .status-pill svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
  .status-pill .msg-title { font-weight: 600; }
  .status-pill a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .status-pill .spin svg { animation: spin 0.9s linear infinite; }

  .footer {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted-2);
  }
  .footer a {
    color: var(--muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer a:hover { color: var(--text); }
  .footer svg { width: 15px; height: 15px; }
</style>
</head>
<body>

<canvas id="network-bg"></canvas>

<div class="wrap">
  <div class="card">
    <div class="brand">
      <h1>HELLO<span class="web3">WEB3</span></h1>
      <div class="sub">Minimal on-chain message board <span class="rule"></span></div>
    </div>

    <div class="step">
      <div class="step-head">
        <div class="badge">1</div>
        <div class="step-title">Connect Wallet</div>
      </div>
      <button class="btn-connect" id="connectBtn">Connect Wallet</button>
      <div class="wallet-chip" id="walletChip">
        <div class="left">
          <span class="dot"></span>
          <span id="walletAddr">0x0000...0000</span>
        </div>
        <button class="copy-btn" id="copyBtn" title="Copy address">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
    </div>

    <div class="step">
      <div class="step-head">
        <div class="badge">2</div>
        <div class="step-title">Current on-chain message</div>
      </div>
      <div class="message-box" id="currentMessage">
        —<span class="cursor"></span>
        <button class="refresh-btn" id="readBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <div class="step">
      <div class="step-head">
        <div class="badge">3</div>
        <div class="step-title">Send new message</div>
      </div>
      <input id="newMessageInput" placeholder="Type a message to write on-chain..." maxlength="140" />
      <button class="btn-send" id="writeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        Send Update
      </button>

      <div class="status-pill" id="statusPill">
        <span class="icon"></span>
        <span class="text"></span>
      </div>
    </div>

    <div class="footer">
      <span>Built for a more open web. 💙</span>
      <a href="https://github.com/Alpha-gltich/hello-web3" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.03 3.26 9.29 7.79 10.8.57.1.78-.25.78-.55v-2.13c-3.17.69-3.83-1.36-3.83-1.36-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.53-2.53-.29-5.19-1.27-5.19-5.63 0-1.24.44-2.26 1.17-3.06-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.15 1.17a10.9 10.9 0 0 1 5.74 0c2.19-1.48 3.15-1.17 3.15-1.17.62 1.57.23 2.73.11 3.02.73.8 1.17 1.82 1.17 3.06 0 4.37-2.67 5.34-5.21 5.62.41.36.77 1.06.77 2.15v3.19c0 .31.21.66.79.55A10.53 10.53 0 0 0 23.5 12c0-6.28-5.23-11.5-11.5-11.5Z"/></svg>
        View on GitHub
      </a>
    </div>
  </div>
</div>

<script type="module">
  import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.13.4/+esm";

  const CONTRACT_ADDRESS = "0x76fe487AD578aAD1A2583ADBFA36dAB74e0c35d3";
  const SEPOLIA_CHAIN_ID = 11155111n;
  const CONTRACT_ABI = [
    {
      "inputs": [{ "internalType": "string", "name": "initialMessage", "type": "string" }],
      "stateMutability": "nonpayable",
      "type": "constructor"
    },
    {
      "inputs": [],
      "name": "message",
      "outputs": [{ "internalType": "string", "name": "", "type": "string" }],
      "stateMutability": "view",
      "type": "function"
    },
    {
      "inputs": [],
      "name": "owner",
      "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
      "stateMutability": "view",
      "type": "function"
    },
    {
      "inputs": [{ "internalType": "string", "name": "newMessage", "type": "string" }],
      "name": "setMessage",
      "outputs": [],
      "stateMutability": "nonpayable",
      "type": "function"
    }
  ];

  let provider, signer, contract;

  const connectBtn = document.getElementById("connectBtn");
  const walletChip = document.getElementById("walletChip");
  const walletAddr = document.getElementById("walletAddr");
  const copyBtn = document.getElementById("copyBtn");
  const msgBox = document.getElementById("currentMessage");
  const readBtn = document.getElementById("readBtn");
  const writeBtn = document.getElementById("writeBtn");
  const input = document.getElementById("newMessageInput");
  const statusPill = document.getElementById("statusPill");

  const ICONS = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
    pending: '<div class="spin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></div>',
    err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  };

  function truncate(addr) {
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  function setStatus(kind, html) {
    statusPill.className = "status-pill visible " + kind;
    statusPill.querySelector(".icon").innerHTML = ICONS[kind] || "";
    statusPill.querySelector(".text").innerHTML = html;
  }

  function clearStatus() {
    statusPill.className = "status-pill";
  }

  async function typeMessage(text) {
    const refreshBtn = msgBox.querySelector(".refresh-btn");
    msgBox.childNodes.forEach((node) => {
      if (node.nodeType === Node.TEXT_NODE || (node.classList && node.classList.contains("cursor"))) {
        node.remove();
      }
    });
    const cursor = document.createElement("span");
    cursor.className = "cursor";

    const chars = text.length ? text.split("") : ["(empty)"];
    let built = "";
    for (let i = 0; i < chars.length; i++) {
      built += text.length ? chars[i] : text;
      const textNode = document.createTextNode(text.length ? built : "(empty)");
      msgBox.insertBefore(textNode, refreshBtn);
      msgBox.insertBefore(cursor, refreshBtn);
      if (i < chars.length - 1) {
        await new Promise((r) => setTimeout(r, 16));
        textNode.remove();
      }
      if (!text.length) break;
    }
  }

  connectBtn.addEventListener("click", async () => {
    if (!window.ethereum) {
      setStatus("err", "No wallet found. Install MetaMask to continue.");
      return;
    }

    connectBtn.disabled = true;
    connectBtn.textContent = "Connecting...";

    try {
      // 1. Request accounts first
      await window.ethereum.request({ method: "eth_requestAccounts" });

      // 2. Read chainId the reliable way
      const chainIdHex = await window.ethereum.request({ method: "eth_chainId" });
      const chainId = BigInt(chainIdHex);

      if (chainId !== SEPOLIA_CHAIN_ID) {
        // Attempt automatic switch
        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0xaa36a7" }], // Sepolia
          });
        } catch (switchErr) {
          setStatus(
            "err",
            "Wrong network — please switch MetaMask to <b>Sepolia</b> and try again."
          );
          connectBtn.disabled = false;
          connectBtn.textContent = "Connect Wallet";
          return;
        }
      }

      // 3. Create provider / signer / contract
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

      const address = await signer.getAddress();
      walletAddr.textContent = truncate(address);
      walletChip.classList.add("visible");
      connectBtn.style.display = "none";
      clearStatus();

      await readMessage();
    } catch (err) {
      console.error(err);
      setStatus("err", "Connection failed: " + (err.reason || err.message));
      connectBtn.disabled = false;
      connectBtn.textContent = "Connect Wallet";
    }
  });

  // Keep UI in sync when user switches network or account
  if (window.ethereum) {
    window.ethereum.on("chainChanged", () => {
      window.location.reload();
    });
    window.ethereum.on("accountsChanged", () => {
      window.location.reload();
    });
  }

  copyBtn.addEventListener("click", async () => {
    if (!signer) return;
    const address = await signer.getAddress();
    await navigator.clipboard.writeText(address);
    const original = copyBtn.innerHTML;
    copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>';
    setTimeout(() => { copyBtn.innerHTML = original; }, 1200);
  });

  async function readMessage() {
    if (!contract) {
      setStatus("err", "Connect your wallet first.");
      return;
    }
    readBtn.disabled = true;
    readBtn.classList.add("spinning");
    try {
      const msg = await contract.message();
      await typeMessage(msg);
    } catch (err) {
      setStatus("err", "Read failed: " + err.message);
    } finally {
      readBtn.disabled = false;
      readBtn.classList.remove("spinning");
    }
  }
  readBtn.addEventListener("click", readMessage);

  writeBtn.addEventListener("click", async () => {
    if (!contract) {
      setStatus("err", "Connect your wallet first.");
      return;
    }
    const newMessage = input.value;
    if (!newMessage) {
      setStatus("err", "Type a message first.");
      return;
    }
    writeBtn.disabled = true;
    try {
      setStatus("pending", "Sending transaction...");
      const tx = await contract.setMessage(newMessage);
      setStatus("pending", "Waiting for confirmation...");
      await tx.wait();
      const etherscanUrl = `https://sepolia.etherscan.io/tx/${tx.hash}`;
      setStatus("ok", `<span class="msg-title">Transaction confirmed</span><br>Message updated on-chain. &middot; <a href="${etherscanUrl}" target="_blank" rel="noreferrer">View on Etherscan ↗</a>`);
      input.value = "";
      await readMessage();
    } catch (err) {
      setStatus("err", "Transaction failed: " + err.message);
    } finally {
      writeBtn.disabled = false;
    }
  });

  // --- background network/constellation effect ---
  (function () {
    const canvas = document.getElementById("network-bg");
    const ctx = canvas.getContext("2d");
    let w, h, points;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.floor((w * h) / 22000);
      points = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.15,
      }));
    }
    window.addEventListener("resize", resize);
    resize();

    function tick() {
      ctx.clearRect(0, 0, w, h);
      for (const p of points) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
      }
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const dx = points[i].x - points[j].x;
          const dy = points[i].y - points[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            ctx.strokeStyle = `rgba(124, 108, 246, ${0.12 * (1 - dist / 130)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(points[i].x, points[i].y);
            ctx.lineTo(points[j].x, points[j].y);
            ctx.stroke();
          }
        }
      }
      for (const p of points) {
        ctx.fillStyle = "rgba(124, 108, 246, 0.35)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>

</body>
</html>
